name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''
      # Linux build is intentionally dropped: it's not a supported
      # collaborator platform right now, and ubuntu-latest's apt repo
      # stopped shipping libappindicator3-dev which broke the install
      # step. Re-add a row here when we want Linux back.
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS build needs both targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libayatana-appindicator3-dev pkg-config libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Fetch ffmpeg sidecar (universal macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: bash scripts/fetch-binaries.sh universal-apple-darwin

      - name: Fetch ffmpeg sidecar (Linux)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: bash scripts/fetch-binaries.sh x86_64-unknown-linux-gnu

      - name: Fetch ffmpeg sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: bash scripts/fetch-binaries.sh x86_64-pc-windows-msvc

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code signing for the internal release path: distributing
          # unsigned bundles to collaborators (control+click → Apri on
          # macOS, "Esegui comunque" on Windows). Re-add the Apple +
          # Tauri-updater secrets here when we decide to ship signed
          # builds. See .github/SIGNING.md for the full list.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Video B-Roll ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
