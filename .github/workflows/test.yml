name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libayatana-appindicator3-dev pkg-config libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright Chromium dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: matrix.platform != 'ubuntu-latest'
        run: npx playwright install chromium

      - name: Fetch ffmpeg sidecar for host target
        shell: bash
        run: bash scripts/fetch-binaries.sh

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest coverage
        run: npm run test:coverage

      - name: Vite build
        run: npm run build

      - name: Playwright
        run: npm run test:pw
