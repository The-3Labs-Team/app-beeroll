[package]
name = "video-broll"
version = "1.0.3"
description = "AI-guided YouTube B-Roll downloader"
authors = ["you"]
edition = "2021"
default-run = "video-broll"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "video-broll"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "video_broll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Gate test-only subprocess mocks so `tauri build` does not bundle them.
test-mocks = []

# Lives under dev-bin/ (not src/bin/) so tauri-cli's src/bin disk scan skips them.
[[bin]]
name = "mock-echo"
path = "dev-bin/mock_echo.rs"
required-features = ["test-mocks"]

[[bin]]
name = "mock-sleep"
path = "dev-bin/mock_sleep.rs"
required-features = ["test-mocks"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"], default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
slug = "0.1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
which = "8"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
mockito = "1"

